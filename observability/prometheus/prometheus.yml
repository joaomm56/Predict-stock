global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "predict-stock-api"
    static_configs:
      - targets: ["host.docker.internal:8000"]  # porta da tua FastAPI

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]